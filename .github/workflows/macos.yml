name: macOS build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: swift test
      - name: Verify app bundle
        run: bash Scripts/build-app.sh
      - name: Archive preview
        run: ditto -c -k --keepParent dist/KongSlides.app dist/KongSlides-macOS-preview.zip
      - uses: actions/upload-artifact@v4
        with:
          name: KongSlides-macOS-preview
          path: dist/KongSlides-macOS-preview.zip
