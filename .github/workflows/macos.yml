name: macOS build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        env:
          KONGSLIDES_WINDOWS_FIXTURE: ${{ github.workspace }}/Windows-classroom.pptx
        run: swift test
      - uses: actions/upload-artifact@v4
        with:
          name: KongSlides-Windows-classroom
          path: Windows-classroom.pptx
          if-no-files-found: error
      - name: Verify app bundle
        run: bash Scripts/build-app.sh
      - name: Archive preview
        run: ditto -c -k --keepParent dist/KongSlides.app dist/KongSlides-macOS-preview.zip
      - uses: actions/upload-artifact@v4
        with:
          name: KongSlides-macOS-preview
          path: dist/KongSlides-macOS-preview.zip


  windows_pptx:
    name: Verify classroom PPTX package on Windows
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: KongSlides-Windows-classroom
          path: fixture
      - name: Check structure and try desktop PowerPoint if installed
        shell: pwsh
        run: ./Scripts/verify-windows-powerpoint.ps1 -File fixture/Windows-classroom.pptx
