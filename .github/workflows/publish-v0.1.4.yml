name: Publish KongSlides v0.1.4

on:
  push:
    branches: [release-v0.1.4]
    paths: [.github/workflows/publish-v0.1.4.yml, Scripts/verify-v0.1.4-upgrade.sh]

permissions:
  actions: read
  contents: write

concurrency:
  group: kongslides-publish-v0.1.4
  cancel-in-progress: false

jobs:
  desktop_smoke:
    name: Test upgrades on a macOS desktop
    runs-on: macos-15
    timeout-minutes: 7
    permissions:
      actions: read
      contents: read
    outputs:
      sha256: ${{ steps.candidate.outputs.sha256 }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_COMMIT: 1c9d822e6345e850c16d2eea3d2a5422ae473c6d
      BUILD_RUN: "45816567756"
    steps:
      - uses: actions/checkout@v4
      - name: Download the tested build
        shell: bash
        id: candidate
        run: |
          gh run watch "$BUILD_RUN" --exit-status --interval 3
          read -r head result <<< "$(gh run view "$BUILD_RUN" --json headSha,conclusion --jq '[.headSha,.conclusion] | @tsv')"
          [[ "$head" == "$SOURCE_COMMIT" && "$result" == success ]]
          gh run download "$BUILD_RUN" --name KongSlides-macOS-preview --dir candidate
          echo "sha256=$(shasum -a 256 candidate/KongSlides-macOS-preview.zip | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Launch, upgrade, relaunch and reopen an existing deck
        run: bash Scripts/verify-v0.1.4-upgrade.sh candidate/KongSlides-macOS-preview.zip

  release:
    needs: desktop_smoke
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_COMMIT: 1c9d822e6345e850c16d2eea3d2a5422ae473c6d
      BUILD_RUN: "45816567756"
      EXPECTED_SHA256: ${{ needs.desktop_smoke.outputs.sha256 }}
    steps:
      - name: Verify the macOS build and prepare assets
        shell: bash
        run: |
          read -r head result <<< "$(gh run view "$BUILD_RUN" --json headSha,conclusion --jq '[.headSha,.conclusion] | @tsv')"
          [[ "$head" == "$SOURCE_COMMIT" && "$result" == success ]]
          gh run download "$BUILD_RUN" --name KongSlides-macOS-preview --dir publish
          cd publish
          mv KongSlides-macOS-preview.zip KongSlides-0.1.4-macOS-preview.zip
          printf '%s  %s\n' "$EXPECTED_SHA256" KongSlides-0.1.4-macOS-preview.zip > SHA256SUMS
          sha256sum --check SHA256SUMS
          unzip -tq KongSlides-0.1.4-macOS-preview.zip
      - name: Publish the preview release
        shell: bash
        run: |
          cat > publish/notes.md <<'EOF'
          - 编辑画布新增四角手柄，图片默认等比缩放。
          - 缩略图支持多选、批量复制、移动和删除。支持按页面或对象复制粘贴、撤销和重做。
          - 章节可折叠及重命名。讲稿区可调整大小和字号，并可打开专注视图逐页编辑或连续阅读。
          - 图片可等比适应、填充和手动裁剪。基础裁剪范围可随 PPTX 导入和导出。
          - 演讲者视图可交换屏幕。显示器断开时保留当前页并显示单屏控件，重新接入可恢复双屏。

          - 修复更新到空目录时的路径检查。若旧版的安装位置不可写，可下载本版安装包手动替换一次。

          安装包适用于 **Apple 芯片、macOS 15 或更新版本**。可在 KongSlides 菜单中选择“检查更新…”。
          EOF
          if ! gh release view v0.1.4 --json isDraft >/dev/null 2>&1; then
            gh release create v0.1.4 --target "$SOURCE_COMMIT" --title 'KongSlides 0.1.4 教学预览版' \
              --draft --prerelease --notes-file publish/notes.md
          fi

          for asset in KongSlides-0.1.4-macOS-preview.zip SHA256SUMS; do
            remote_digest="$(gh api "repos/$GH_REPO/releases" --jq ".[] | select(.tag_name == \"v0.1.4\") | .assets[] | select(.name == \"$asset\") | .digest")"
            if [[ -z "$remote_digest" ]]; then
              [[ "$(gh release view v0.1.4 --json isDraft --jq .isDraft)" == true ]]
              gh release upload v0.1.4 "publish/$asset"
              remote_digest="$(gh api "repos/$GH_REPO/releases" --jq ".[] | select(.tag_name == \"v0.1.4\") | .assets[] | select(.name == \"$asset\") | .digest")"
            fi
            local_digest="sha256:$(sha256sum "publish/$asset" | cut -d ' ' -f 1)"
            [[ "$remote_digest" == "$local_digest" ]]
          done

          gh release edit v0.1.4 --draft=false --prerelease --latest=false
          [[ "$(gh api "repos/$GH_REPO/commits/v0.1.4" --jq .sha)" == "$SOURCE_COMMIT" ]]
          gh release view v0.1.4 --json url,isDraft,isPrerelease,assets --jq '{url,isDraft,isPrerelease,assets:[.assets[] | .name]}'
