name: Publish KongSlides v0.2.6

on:
  push:
    branches: [release-v0.2.6]
    paths: [.github/workflows/publish-v0.2.6.yml, Scripts/verify-v0.2.6-upgrade.sh]

permissions:
  actions: read
  contents: write

concurrency:
  group: kongslides-publish-v0.2.6
  cancel-in-progress: false

jobs:
  desktop_smoke:
    name: Test upgrades on a macOS desktop
    runs-on: macos-26
    timeout-minutes: 7
    permissions:
      actions: read
      contents: read
    outputs:
      sha256: ${{ steps.candidate.outputs.sha256 }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_COMMIT: 0b72fd01c05a02061628f30b131a8091c2689520
      BUILD_RUN: "45922255768"
    steps:
      - uses: actions/checkout@v4
      - name: Download the tested build
        shell: bash
        id: candidate
        run: |
          gh run watch "$BUILD_RUN" --exit-status --interval 3
          read -r head result <<< "$(gh run view "$BUILD_RUN" --json headSha,conclusion --jq '[.headSha,.conclusion] | @tsv')"
          [[ "$head" == "$SOURCE_COMMIT" && "$result" == success ]]
          gh run download "$BUILD_RUN" --name KongSlides-macOS-preview --dir candidate
          echo "sha256=$(shasum -a 256 candidate/KongSlides-macOS-preview.zip | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Launch, upgrade, relaunch and reopen an existing deck
        run: bash Scripts/verify-v0.2.6-upgrade.sh candidate/KongSlides-macOS-preview.zip

  release:
    needs: desktop_smoke
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_COMMIT: 0b72fd01c05a02061628f30b131a8091c2689520
      BUILD_RUN: "45922255768"
      EXPECTED_SHA256: ${{ needs.desktop_smoke.outputs.sha256 }}
    steps:
      - name: Verify the macOS build and prepare assets
        shell: bash
        run: |
          read -r head result <<< "$(gh run view "$BUILD_RUN" --json headSha,conclusion --jq '[.headSha,.conclusion] | @tsv')"
          [[ "$head" == "$SOURCE_COMMIT" && "$result" == success ]]
          gh run download "$BUILD_RUN" --name KongSlides-macOS-preview --dir publish
          cd publish
          mv KongSlides-macOS-preview.zip KongSlides-0.2.6-macOS-preview.zip
          printf '%s  %s\n' "$EXPECTED_SHA256" KongSlides-0.2.6-macOS-preview.zip > SHA256SUMS
          sha256sum --check SHA256SUMS
          unzip -tq KongSlides-0.2.6-macOS-preview.zip
      - name: Publish the preview release
        shell: bash
        run: |
          cat > publish/notes.md <<'EOF'
          - PPTX 表格保留行列比例、合并单元格、文字和直接设置的纯色填充。导出 PPTX 时表格保持可编辑，也可随课件导出投影 PDF。
          - 双击表格可修改单元格文字。工具栏可插入基础表格，课件搜索覆盖表格内容。
          - PowerPoint 主题表格样式与特殊边框会简化，导入报告会提示。

          安装包适用于 **Apple 芯片、macOS 15 或更新版本**。可从应用内「检查更新…」安装。
          EOF
          if ! gh release view v0.2.6 --json isDraft >/dev/null 2>&1; then
            gh release create v0.2.6 --target "$SOURCE_COMMIT" --title 'KongSlides 0.2.6 教学预览版' \
              --draft --prerelease --notes-file publish/notes.md
          fi

          for asset in KongSlides-0.2.6-macOS-preview.zip SHA256SUMS; do
            remote_digest="$(gh api "repos/$GH_REPO/releases" --jq ".[] | select(.tag_name == \"v0.2.6\") | .assets[] | select(.name == \"$asset\") | .digest")"
            if [[ -z "$remote_digest" ]]; then
              [[ "$(gh release view v0.2.6 --json isDraft --jq .isDraft)" == true ]]
              gh release upload v0.2.6 "publish/$asset"
              remote_digest="$(gh api "repos/$GH_REPO/releases" --jq ".[] | select(.tag_name == \"v0.2.6\") | .assets[] | select(.name == \"$asset\") | .digest")"
            fi
            local_digest="sha256:$(sha256sum "publish/$asset" | cut -d ' ' -f 1)"
            [[ "$remote_digest" == "$local_digest" ]]
          done

          gh release edit v0.2.6 --draft=false --prerelease --latest=false
          [[ "$(gh api "repos/$GH_REPO/commits/v0.2.6" --jq .sha)" == "$SOURCE_COMMIT" ]]
          gh release view v0.2.6 --json url,isDraft,isPrerelease,assets --jq '{url,isDraft,isPrerelease,assets:[.assets[] | .name]}'
