name: KongSlides 0.2.19 desktop verification
on:
  push:
    branches: [codex/kongslides-0.2.19-desktop]
    paths: [.github/workflows/verify-0.2.19-desktop.yml, Scripts/verify-0.2.19-editor.swift]
permissions:
  actions: read
  contents: read
jobs:
  editor:
    runs-on: macos-15
    timeout-minutes: 4
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_RUN: "46018909361"
    steps:
      - uses: actions/checkout@v4
      - name: Download candidate
        run: |
          gh run watch "$BUILD_RUN" --exit-status --interval 4
          gh run download "$BUILD_RUN" --name KongSlides-macOS-preview --dir candidate
          ditto -x -k candidate/KongSlides-macOS-preview.zip candidate
      - name: Test Save As after importing a PowerPoint file on macOS
        shell: bash
        run: |
          set -euo pipefail
          root="$(mktemp -d)"
          app="$PWD/candidate/KongSlides.app"
          defaults write com.kongslides.app checkForUpdatesAutomatically -bool false
          gh run download "$BUILD_RUN" --name KongSlides-Windows-classroom --dir "$root"
          mv "$root/Windows-classroom.pptx" "$root/Classroom.pptx"
          original_digest="$(shasum -a 256 "$root/Classroom.pptx")"
          swiftc Scripts/verify-0.2.19-editor.swift -o "$root/editor-smoke"
          open -n -a "$app" "$root/Classroom.pptx"
          pid=""
          for _ in {1..20}; do
            pid="$(pgrep -nf "$app/Contents/MacOS/KongSlides" || true)"
            [[ -n "$pid" ]] && break
            sleep 1
          done
          [[ -n "$pid" ]]
          "$root/editor-smoke" "$pid"
          for _ in {1..20}; do
            [[ -s "$root/Classroom.kongslides" ]] && break
            sleep 1
          done
          [[ "$(shasum -a 256 "$root/Classroom.pptx")" == "$original_digest" ]]
          python3 - "$root/Classroom.kongslides" <<'PYTEST'
          import json, sys
          with open(sys.argv[1]) as src:
              deck=json.load(src)
          assert deck["slides"]
          print("Save As produced a valid native deck, and the original PowerPoint checksum was unchanged.")
          PYTEST
