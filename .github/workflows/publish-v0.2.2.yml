name: Publish KongSlides v0.2.2

on:
  push:
    branches: [release-v0.2.2]
    paths: [.github/workflows/publish-v0.2.2.yml, Scripts/verify-v0.2.2-upgrade.sh]

permissions:
  actions: read
  contents: write

concurrency:
  group: kongslides-publish-v0.2.2
  cancel-in-progress: false

jobs:
  desktop_smoke:
    name: Test upgrades on a macOS desktop
    runs-on: macos-26
    timeout-minutes: 7
    permissions:
      actions: read
      contents: read
    outputs:
      sha256: ${{ steps.candidate.outputs.sha256 }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_COMMIT: 299b3e39efee7ad5b2243c1e1381f24f8b7b7fda
      BUILD_RUN: "45919023786"
    steps:
      - uses: actions/checkout@v4
      - name: Download the tested build
        shell: bash
        id: candidate
        run: |
          gh run watch "$BUILD_RUN" --exit-status --interval 3
          read -r head result <<< "$(gh run view "$BUILD_RUN" --json headSha,conclusion --jq '[.headSha,.conclusion] | @tsv')"
          [[ "$head" == "$SOURCE_COMMIT" && "$result" == success ]]
          gh run download "$BUILD_RUN" --name KongSlides-macOS-preview --dir candidate
          echo "sha256=$(shasum -a 256 candidate/KongSlides-macOS-preview.zip | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Launch, upgrade, relaunch and reopen an existing deck
        run: bash Scripts/verify-v0.2.2-upgrade.sh candidate/KongSlides-macOS-preview.zip

  release:
    needs: desktop_smoke
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_COMMIT: 299b3e39efee7ad5b2243c1e1381f24f8b7b7fda
      BUILD_RUN: "45919023786"
      EXPECTED_SHA256: ${{ needs.desktop_smoke.outputs.sha256 }}
    steps:
      - name: Verify the macOS build and prepare assets
        shell: bash
        run: |
          read -r head result <<< "$(gh run view "$BUILD_RUN" --json headSha,conclusion --jq '[.headSha,.conclusion] | @tsv')"
          [[ "$head" == "$SOURCE_COMMIT" && "$result" == success ]]
          gh run download "$BUILD_RUN" --name KongSlides-macOS-preview --dir publish
          cd publish
          mv KongSlides-macOS-preview.zip KongSlides-0.2.2-macOS-preview.zip
          printf '%s  %s\n' "$EXPECTED_SHA256" KongSlides-0.2.2-macOS-preview.zip > SHA256SUMS
          sha256sum --check SHA256SUMS
          unzip -tq KongSlides-0.2.2-macOS-preview.zip
      - name: Publish the preview release
        shell: bash
        run: |
          cat > publish/notes.md <<'EOF'
          - 应用内更新显示下载百分比，以及校验、替换应用和重启的当前阶段。更新到本版后，下一次更新会显示完整进度。
          - 普通文件打开、Finder「打开方式」和将 PPTX 拖进窗口都可进入导入流程。兼容两类 OOXML 关系、UTF-16 和合法的包内路径。部分损坏时尽可能导入，并显示页码及失败原因。
          - 放映支持 B 键黑屏、P 键临时画笔。可一次导出当前章节的投影、讲稿和学生配布三份 PDF。

          安装包适用于 **Apple 芯片、macOS 15 或更新版本**。
          EOF
          if ! gh release view v0.2.2 --json isDraft >/dev/null 2>&1; then
            gh release create v0.2.2 --target "$SOURCE_COMMIT" --title 'KongSlides 0.2.2 教学预览版' \
              --draft --prerelease --notes-file publish/notes.md
          fi

          for asset in KongSlides-0.2.2-macOS-preview.zip SHA256SUMS; do
            remote_digest="$(gh api "repos/$GH_REPO/releases" --jq ".[] | select(.tag_name == \"v0.2.2\") | .assets[] | select(.name == \"$asset\") | .digest")"
            if [[ -z "$remote_digest" ]]; then
              [[ "$(gh release view v0.2.2 --json isDraft --jq .isDraft)" == true ]]
              gh release upload v0.2.2 "publish/$asset"
              remote_digest="$(gh api "repos/$GH_REPO/releases" --jq ".[] | select(.tag_name == \"v0.2.2\") | .assets[] | select(.name == \"$asset\") | .digest")"
            fi
            local_digest="sha256:$(sha256sum "publish/$asset" | cut -d ' ' -f 1)"
            [[ "$remote_digest" == "$local_digest" ]]
          done

          gh release edit v0.2.2 --draft=false --prerelease --latest=false
          [[ "$(gh api "repos/$GH_REPO/commits/v0.2.2" --jq .sha)" == "$SOURCE_COMMIT" ]]
          gh release view v0.2.2 --json url,isDraft,isPrerelease,assets --jq '{url,isDraft,isPrerelease,assets:[.assets[] | .name]}'
