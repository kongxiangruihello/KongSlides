name: Publish KongSlides v0.1.1

on:
  push:
    branches: [release-v0.1.1]
    paths: [.github/workflows/publish-v0.1.1.yml]

permissions:
  actions: read
  contents: write

concurrency:
  group: kongslides-publish-v0.1.1
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_COMMIT: 69661018d5b55273a2580e4439b429d1d4189e61
      BUILD_RUN: "45634883629"
      EXPECTED_SHA256: 72981c9d39000dc7db49066bf3a7735f904c2a0624e9ac8a086d3beba07802e5
    steps:
      - name: Verify the macOS build and prepare assets
        shell: bash
        run: |
          read -r head result <<< "$(gh run view "$BUILD_RUN" --json headSha,conclusion --jq '[.headSha,.conclusion] | @tsv')"
          [[ "$head" == "$SOURCE_COMMIT" && "$result" == success ]]
          gh run download "$BUILD_RUN" --name KongSlides-macOS-preview --dir publish
          cd publish
          mv KongSlides-macOS-preview.zip KongSlides-0.1.1-macOS-preview.zip
          printf '%s  %s\n' "$EXPECTED_SHA256" KongSlides-0.1.1-macOS-preview.zip > SHA256SUMS
          sha256sum --check SHA256SUMS
          unzip -tq KongSlides-0.1.1-macOS-preview.zip
      - name: Publish the preview release
        shell: bash
        run: |
          cat > publish/notes.md <<'EOF'
          KongSlides 0.1.1 新增应用内软件更新。

          - 启动后自动检查，应用菜单也可手动检查或关闭自动检查。
          - 从 KongSlides GitHub Release 下载并校验 SHA-256、应用包签名和版本。
          - 确认后正常退出，安装完成后重新打开。若启动命令失败，会尝试恢复旧版。

          0.1.0 用户首次升级请下载 ZIP，退出旧版后用解压出的 `KongSlides.app` 替换。以后可通过“检查更新…”升级，课件无需迁移。

          适用于 **Apple 芯片、macOS 15 或更新版本**。预览包使用临时签名。本次 macOS 测试覆盖版本筛选、安装包校验、应用包替换及回退。
          EOF
          if ! gh release view v0.1.1 --json isDraft >/dev/null 2>&1; then
            gh release create v0.1.1 --target "$SOURCE_COMMIT" --title 'KongSlides 0.1.1 教学预览版' \
              --draft --prerelease --notes-file publish/notes.md
          fi

          for asset in KongSlides-0.1.1-macOS-preview.zip SHA256SUMS; do
            remote_digest="$(gh api "repos/$GH_REPO/releases" --jq ".[] | select(.tag_name == \"v0.1.1\") | .assets[] | select(.name == \"$asset\") | .digest")"
            if [[ -z "$remote_digest" ]]; then
              [[ "$(gh release view v0.1.1 --json isDraft --jq .isDraft)" == true ]]
              gh release upload v0.1.1 "publish/$asset"
              remote_digest="$(gh api "repos/$GH_REPO/releases" --jq ".[] | select(.tag_name == \"v0.1.1\") | .assets[] | select(.name == \"$asset\") | .digest")"
            fi
            local_digest="sha256:$(sha256sum "publish/$asset" | cut -d ' ' -f 1)"
            [[ "$remote_digest" == "$local_digest" ]]
          done

          gh release edit v0.1.1 --draft=false --prerelease --latest=false
          [[ "$(gh api "repos/$GH_REPO/commits/v0.1.1" --jq .sha)" == "$SOURCE_COMMIT" ]]
          gh release view v0.1.1 --json url,isDraft,isPrerelease,assets --jq '{url,isDraft,isPrerelease,assets:[.assets[] | .name]}'
